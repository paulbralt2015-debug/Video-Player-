name: Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Télécharger libmpv (bibliothèque seule, sans mpv.exe ni ffmpeg.exe)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir libmpv
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*' --dir libmpv
          7z x libmpv/*.7z -olibmpv/x -y
          f=$(find libmpv/x \( -iname 'libmpv-2.dll' -o -iname 'mpv-2.dll' \) | head -n 1)
          test -n "$f"
          cp "$f" libmpv-2.dll

      - name: Compiler
        shell: pwsh
        run: pyinstaller --noconfirm --windowed --name TwinsVideoPlayer --add-binary "libmpv-2.dll;." run.py

      - name: Vérifier qu'aucun ffmpeg.exe n'est livré
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist -Recurse -Filter 'ffmpeg*.exe'
          if ($bad) { $bad | ForEach-Object FullName; exit 1 }

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/TwinsVideoPlayer -DestinationPath TwinsVideoPlayer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TwinsVideoPlayer-windows-x64
          path: TwinsVideoPlayer-windows-x64.zip

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TwinsVideoPlayer-windows-x64.zip
